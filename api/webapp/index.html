<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kabura Fresh</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --cream-50: #FFFCF7;
      --cream-100: #FAF3EA;
      --cream-300: #E8D9C2;
      --orange: #E8792E;
      --brown-900: #3D3226;
      --brown-500: #8A7B68;
      --terracotta: #B5482B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cream-100);
      color: var(--brown-900);
      padding: 24px 20px;
      min-height: 100vh;
    }
    .card {
      background: var(--cream-50);
      border: 1px solid var(--cream-300);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
    }
    h1 { font-size: 22px; margin-bottom: 6px; }
    .muted { color: var(--brown-500); font-size: 14px; }
    .status { font-weight: 600; margin: 4px 0 12px; }
    .status.ok { color: var(--orange); }
    .status.err { color: var(--terracotta); }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--cream-300); font-size: 15px; }
    .row:first-of-type { border-top: none; }
    .row .k { color: var(--brown-500); }
    .row .v { font-weight: 600; text-align: right; word-break: break-word; }
    pre { background: var(--cream-100); border-radius: 10px; padding: 12px; font-size: 12px; overflow-x: auto; color: var(--brown-500); }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="greeting">Kabura Fresh</h1>
    <div class="muted">Диагностическая страница Mini App</div>
    <div class="status" id="status">Проверяем авторизацию…</div>
    <div id="profile"></div>
  </div>

  <div class="card">
    <div class="muted" style="margin-bottom:8px">Ответ /api/me</div>
    <pre id="raw">—</pre>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    const $ = (id) => document.getElementById(id);

    function setStatus(text, kind) {
      const el = $("status");
      el.textContent = text;
      el.className = "status" + (kind ? " " + kind : "");
    }

    function row(k, v) {
      return '<div class="row"><span class="k">' + k + '</span><span class="v">' + (v || "—") + "</span></div>";
    }

    if (!tg || !tg.initData) {
      setStatus("Откройте страницу внутри Telegram — здесь нет initData.", "err");
    } else {
      tg.ready();
      tg.expand();
      // Подхватываем тему Telegram
      if (tg.themeParams && tg.themeParams.bg_color) {
        document.body.style.background = tg.themeParams.bg_color;
      }

      fetch("/api/me", { headers: { Authorization: "tma " + tg.initData } })
        .then(async (res) => {
          const body = await res.json();
          $("raw").textContent = JSON.stringify(body, null, 2);
          if (!res.ok) {
            setStatus("Ошибка авторизации (" + res.status + ")", "err");
            return;
          }
          setStatus("✅ Авторизация Telegram прошла", "ok");
          $("greeting").textContent = "Привет, " + (body.first_name || "друг") + "!";
          $("profile").innerHTML =
            row("Telegram ID", body.telegram_id) +
            row("Имя", body.customer_name || body.first_name) +
            row("Телефон", body.phone) +
            row("Адрес", body.delivery_address);
        })
        .catch((e) => {
          setStatus("Сетевая ошибка: " + e.message, "err");
        });
    }
  </script>
</body>
</html>
